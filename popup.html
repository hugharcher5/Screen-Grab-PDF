<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Screen Capture to Downloads</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="panel">
      <header class="header">
        <h1>Screen Capture to Downloads</h1>
        <p class="version">Version <span id="version">1.1.0</span></p>
      </header>

      <section class="section">
        <h2>Workflow</h2>
        <ol class="steps">
          <li>
            <span class="hotkey" id="hotkey-capture">Ctrl+Shift+C</span>
            Capture page → Downloads
          </li>
          <li>Switch to ChatGPT / Claude / Gemini</li>
          <li>
            <span class="hotkey" id="hotkey-attach">Ctrl+Shift+A</span>
            Open file picker → select PDF
          </li>
        </ol>
        <a id="shortcuts-link" href="#" class="link">Change shortcuts in Chrome…</a>
      </section>

      <section class="section">
        <button id="capture-btn" type="button" class="button">Capture Page as PDF Now</button>
        <button id="attach-btn" type="button" class="button button-secondary">
          How to open file picker
        </button>
        <p id="status" class="status" role="status" aria-live="polite"></p>
      </section>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
